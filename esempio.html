<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esempio medievale realistico — Opzione 1</title>
<style>*{margin:0}html,body{height:100%;overflow:hidden;background:#111}#c{display:block;width:100%;height:100%}
#t{position:fixed;top:10px;left:10px;background:rgba(20,16,30,.72);color:#fff;font:700 13px system-ui;padding:7px 12px;border-radius:10px;z-index:2}</style>
<canvas id="c"></canvas>
<div id="t">Esempio · medievale, meno esagoni + più reale (asset reali CC0)</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();const SKY=0x93bcdc;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,30,80);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,300);
scene.add(new THREE.HemisphereLight(0xdceeff,0x5a5240,0.5));
const sun=new THREE.DirectionalLight(0xfff1dc,2.0);sun.position.set(-14,24,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=90;sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
// HDR per luce realistica
try{new THREE.RGBELoader().load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/equirectangular/royal_esplanade_1k.hdr',t=>{const p=new THREE.PMREMGenerator(renderer);p.compileEquirectangularShader();scene.environment=p.fromEquirectangular(t).texture;t.dispose();p.dispose();});}catch(e){}
// terreno continuo (erba texturizzata)
const tl=new THREE.TextureLoader();const grass=tl.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/terrain/grasslight-big.jpg');
grass.wrapS=grass.wrapT=THREE.RepeatWrapping;grass.repeat.set(26,26);grass.encoding=THREE.sRGBEncoding;grass.anisotropy=4;
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,56),new THREE.MeshStandardMaterial({map:grass,color:0x9cbf7e,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// strade sterrate
function road(w,h,x,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:0xc2a878,roughness:1}));m.rotation.x=-Math.PI/2;m.rotation.z=ry||0;m.position.set(x,0.03,z);m.receiveShadow=true;scene.add(m);}
road(4,34,0,0);road(30,4,0,0);
const B='https://cdn.jsdelivr.net/gh/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0@main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/';
const AD='https://cdn.jsdelivr.net/gh/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0@main/addons/kaykit_character_pack_adventures/Characters/gltf/';
const SK='https://cdn.jsdelivr.net/gh/KayKit-Game-Assets/KayKit-Character-Pack-Skeletons-1.0@main/addons/kaykit_character_pack_skeletons/Characters/gltf/';
const L=new THREE.GLTFLoader();
const SEAT=0.18; // posa l'edificio sull'erba dopo aver tolto l'esagono
function load(url,x,z,s,ry,yy){L.load(url,g=>{const o=g.scene;o.traverse(m=>{if(m.isMesh){if(m.name&&m.name.toLowerCase().indexOf('hexagon')>=0){m.visible=false;return;}m.castShadow=true;m.receiveShadow=true;}});o.position.set(x,(yy!=null?yy:0),z);o.scale.setScalar(s||1);o.rotation.y=ry||0;scene.add(o);},undefined,e=>{});}
function bld(name,x,z,ry){load(B+'buildings/blue/building_'+name+'_blue.gltf',x,z,1,ry||0,-SEAT);}
// città medievale su terreno continuo (niente esagoni a vista)
bld('castle',0,0,0.4);
bld('church',-4.2,-1,0.2);bld('barracks',4.2,-1,-0.2);bld('market',-1,-4.2,0.1);bld('tavern',1,4.2,0.3);
bld('blacksmith',-4.4,-4.4,0.5);bld('lumbermill',4.4,-4.4,-0.4);bld('watermill',-4.4,4.4,0.2);bld('windmill',4.4,4.4,-0.1);
bld('home_A',-2.2,-2.3,0.2);bld('home_B',2.3,-2.2,-0.3);bld('home_A',-2.3,2.3,0.5);bld('home_B',2.2,2.4,0.1);
bld('tower_A',7,1,0);bld('home_A',7,-3,0.3);bld('well',-1.4,1.6,0);bld('mine',-7,-2,0.4);bld('home_B',-7,2,-0.2);
// un secondo popolo poco distante (variante rossa) = altre terre/altri popoli
load(B+'buildings/red/building_castle_red.gltf',15,-7,1,0.3,-SEAT);load(B+'buildings/red/building_home_A_red.gltf',17.5,-6,1,0.5,-SEAT);load(B+'buildings/red/building_barracks_red.gltf',14.5,-10,1,-0.3,-SEAT);load(B+'buildings/red/building_tower_A_red.gltf',18,-9.5,1,0,-SEAT);
// rocce (senza base)
load(B+'decoration/nature/rock_single_A.gltf',-9,6,1.4,0);load(B+'decoration/nature/rock_single_C.gltf',9,-8,1.4,1);load(B+'decoration/nature/rock_single_B.gltf',10,7,1.3,2);
// personaggi = popoli con abilità (piccoli rispetto agli edifici, scala umana reale)
const PS=0.16; // persona reale ~1/3 di una casa: entra dalla porta
load(AD+'Knight.glb',2.3,-1.1,PS,3.14);  // davanti alla porta di una casa
load(AD+'Mage.glb',-2.1,-1.2,PS,0.0);
load(AD+'Barbarian.glb',1.0,0.1,PS,-1.0);
load(AD+'Rogue.glb',-1.0,1.0,PS,2.0);
// nemici Ombra (scheletri)
load(SK+'Skeleton_Warrior.glb',-4,6,PS,3.0);load(SK+'Skeleton_Rogue.glb',-3,6.4,PS,3.0);load(SK+'Skeleton_Minion.glb',-4.6,6.6,0.15,2.8);
let a=0.7;
function tick(){requestAnimationFrame(tick);a+=0.0013;const r=8.4,h=4.2;camera.position.set(Math.sin(a)*r,h,Math.cos(a)*r+1.5);camera.lookAt(0,1.1,0);renderer.render(scene,camera);}
tick();
</script>
