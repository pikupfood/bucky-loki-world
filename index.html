<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>I Regni di Tuzu — L'Èrebo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#8fc3e6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-top));justify-content:center;flex-wrap:wrap;z-index:5;pointer-events:none}
.res{background:rgba(26,22,40,.82);border-radius:11px;padding:5px 9px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;line-height:1;min-width:54px;justify-content:center}
.ico{font-size:15px}
#build{position:fixed;left:0;right:0;bottom:0;display:flex;gap:7px;padding:9px 9px calc(9px + env(safe-area-inset-bottom));overflow-x:auto;z-index:5;background:linear-gradient(to top,rgba(20,16,30,.85),rgba(20,16,30,0))}
.bbtn{flex:0 0 auto;background:rgba(32,27,48,.94);border:1.5px solid rgba(255,255,255,.14);border-radius:13px;width:70px;padding:8px 4px;text-align:center;cursor:pointer;transition:.12s}
.bbtn:active{transform:scale(.94)}
.bbtn.sel{border-color:#7fdbb7;background:rgba(31,110,86,.92)}
.bbtn .n{font-size:11px;font-weight:700;margin-top:3px;line-height:1.15}
.bbtn .co{font-size:9px;opacity:.78;margin-top:3px;font-weight:600}
.bbtn .em{font-size:23px;line-height:1}
#side{position:fixed;right:9px;top:calc(60px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;z-index:5}
.sbtn{position:relative;background:rgba(26,22,40,.86);border:1.5px solid rgba(255,255,255,.16);border-radius:13px;width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:20px;gap:1px}
.sbtn:active{transform:scale(.93)}
.sbtn b{font-size:8.5px;font-weight:700;opacity:.85}
.badge{position:absolute;top:-4px;right:-4px;background:#e24b4a;border-radius:9px;min-width:17px;height:17px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(26,22,40,.92);padding:8px 15px;border-radius:12px;font-size:13px;font-weight:600;z-index:7;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.panel{position:fixed;inset:0;background:rgba(10,8,18,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:18px}
.card{background:#211b30;border:1.5px solid rgba(255,255,255,.14);border-radius:20px;max-width:380px;width:100%;padding:20px;text-align:center}
.card h2{font-size:20px;margin-bottom:8px}
.card p{font-size:14px;opacity:.9;line-height:1.5;margin-bottom:14px;font-weight:500}
.card .em{font-size:46px;margin-bottom:6px}
.btn{background:#1d9e75;border:none;color:#fff;font-size:15px;font-weight:800;padding:12px 20px;border-radius:13px;cursor:pointer;width:100%;margin-top:7px}
.btn.alt{background:rgba(255,255,255,.12)}
.btn:active{transform:scale(.97)}
#bat{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 11px 9px;z-index:6}
#bat .t{background:rgba(26,22,40,.9);padding:7px 13px;border-radius:12px;font-size:13px;font-weight:700}
#endturn{background:#e24b4a;border:none;color:#fff;font-weight:800;font-size:13px;padding:9px 15px;border-radius:12px;cursor:pointer}
#hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(26,22,40,.9);padding:8px 14px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:6;display:none;text-align:center;max-width:90vw}
#load{position:fixed;inset:0;background:#14101e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:14px}
#load .em{font-size:52px}
#load .bar{width:180px;height:6px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden}
#load .bar i{display:block;height:100%;width:5%;background:#1d9e75;transition:.3s}
#load p{font-size:13px;opacity:.8;font-weight:600}
</style>

<canvas id="c"></canvas>

<div id="top"></div>
<div id="side">
  <div class="sbtn" id="btnTrain"><span>⚔️</span><b>Addestra</b></div>
  <div class="sbtn" id="btnBattle"><span>🗺️</span><b>Èrebo</b><span class="badge" id="soldBadge">0</span></div>
</div>
<div id="build"></div>

<div id="bat"><div class="t" id="batInfo">Il tuo turno</div><button id="endturn">Fine turno ▸</button></div>
<div id="hint"></div>
<div id="toast"></div>

<div id="load"><div class="em">🏰</div><div class="bar"><i id="loadbar"></i></div><p id="loadtxt">Preparo il regno…</p></div>

<div class="panel" id="intro">
  <div class="card">
    <div class="em">🌿</div>
    <h2>I Regni di Tuzu</h2>
    <p>Un male antico, l'<b>Èrebo</b>, divora le terre. Guidi i <b>Chlòri</b>, il popolo verde delle Valli di Dèndora. Costruisci il regno, fai lavorare i Tuzu, addestra i soldati e respingi l'Ombra.</p>
    <button class="btn" id="startBtn">Inizia a costruire</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script>
// ===== SETUP 3D =====
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();const SKY=0x8fc3e6;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,36,74);
let VZ=11;const camera=new THREE.OrthographicCamera(-VZ,VZ,VZ,-VZ,0.1,200);
function placeCam(){camera.position.set(26,30,26);camera.lookAt(0,0,0);}
placeCam();
scene.add(new THREE.HemisphereLight(0xdceeff,0x5a5240,0.55));
const sun=new THREE.DirectionalLight(0xfff1dc,2.0);sun.position.set(-16,26,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=100;
sun.shadow.camera.left=-26;sun.shadow.camera.right=26;sun.shadow.camera.top=26;sun.shadow.camera.bottom=-26;sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);const a=w/h;camera.left=-VZ*a;camera.right=VZ*a;camera.top=VZ;camera.bottom=-VZ;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
try{new THREE.RGBELoader().load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/equirectangular/royal_esplanade_1k.hdr',t=>{const p=new THREE.PMREMGenerator(renderer);p.compileEquirectangularShader();scene.environment=p.fromEquirectangular(t).texture;t.dispose();p.dispose();});}catch(e){}

// ===== TERRENO + GRIGLIA =====
const GRID=11, CELL=2.4, HALF=(GRID-1)/2;
const tl=new THREE.TextureLoader();
const grass=tl.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/terrain/grasslight-big.jpg');
grass.wrapS=grass.wrapT=THREE.RepeatWrapping;grass.repeat.set(16,16);grass.encoding=THREE.sRGBEncoding;grass.anisotropy=4;
const ground=new THREE.Mesh(new THREE.CircleGeometry(60,56),new THREE.MeshStandardMaterial({map:grass,color:0x9cbf7e,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function cellToWorld(cx,cy){return [(cx-HALF)*CELL,(cy-HALF)*CELL];}
const cityGroup=new THREE.Group();scene.add(cityGroup);
const gmat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.06});
for(let x=0;x<GRID;x++)for(let y=0;y<GRID;y++){const [wx,wz]=cellToWorld(x,y);const t=new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.96,CELL*0.96),gmat);t.rotation.x=-Math.PI/2;t.position.set(wx,0.02,wz);cityGroup.add(t);}
const hl=new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.98,CELL*0.98),new THREE.MeshBasicMaterial({color:0x7fffb0,transparent:true,opacity:0.33}));
hl.rotation.x=-Math.PI/2;hl.position.y=0.05;hl.visible=false;cityGroup.add(hl);

// ===== ASSET =====
const B='https://cdn.jsdelivr.net/gh/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0@main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/';
const AD='https://cdn.jsdelivr.net/gh/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0@main/addons/kaykit_character_pack_adventures/Characters/gltf/';
const SK='https://cdn.jsdelivr.net/gh/KayKit-Game-Assets/KayKit-Character-Pack-Skeletons-1.0@main/addons/kaykit_character_pack_skeletons/Characters/gltf/';
const L=new THREE.GLTFLoader();
function stripHex(o){o.traverse(m=>{if(m.isMesh){if(m.name&&m.name.toLowerCase().indexOf('hexagon')>=0){m.visible=false;return;}m.castShadow=true;m.receiveShadow=true;}});return o;}
function loadModel(url){return new Promise(res=>{L.load(url,g=>res(stripHex(g.scene)),undefined,()=>res(new THREE.Group()));});}
const col='green';
const BUILD={
  casa:    {nome:'Casa',    em:'🏠', file:'home_A',    cost:{legna:35},            pop:3},
  segheria:{nome:'Segheria',em:'🪵', file:'lumbermill',cost:{legna:30},            prod:{r:'legna',a:4,t:4},job:1},
  fattoria:{nome:'Fattoria',em:'🌾', file:'windmill',  cost:{legna:35},            prod:{r:'cibo', a:4,t:4},job:1},
  cava:    {nome:'Cava',    em:'🪨', file:'mine',      cost:{legna:45},            prod:{r:'pietra',a:3,t:5},job:1},
  fonderia:{nome:'Fonderia',em:'⚙️', file:'blacksmith',cost:{legna:45,pietra:30},  prod:{r:'ferro',a:2,t:6},job:1},
  mercato: {nome:'Mercato', em:'🪙', file:'market',    cost:{legna:45,pietra:25},  prod:{r:'oro',  a:2,t:6},job:1},
  caserma: {nome:'Caserma', em:'⚔️', file:'barracks',  cost:{legna:60,pietra:40,ferro:10}}
};
const RES={legna:'🪵',cibo:'🌾',pietra:'🪨',ferro:'⚙️',oro:'🪙'};
let templates={};
async function preload(){
  const names=['home_A','lumbermill','windmill','mine','blacksmith','market','barracks','castle'];
  let done=0;const total=names.length+2;
  for(const n of names){templates[n]=await loadModel(B+'buildings/'+col+'/building_'+n+'_'+col+'.gltf');done++;setLoad(done/total);}
  templates.rock=await loadModel(B+'decoration/nature/rock_single_A.gltf');done++;setLoad(done/total);
  templates.worker=await loadModel(AD+'Rogue.glb');done++;setLoad(done/total);
}
function inst(name){const t=templates[name];if(!t)return new THREE.Group();const c=t.clone(true);c.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});return c;}
function setLoad(f){document.getElementById('loadbar').style.width=Math.round(f*100)+'%';}

// ===== STATO =====
const SEAT=0.18, PS=0.16;
let R={legna:140,cibo:60,pietra:50,ferro:12,oro:25};
let grid={}, buildings=[], soldiers=0, terreLiberate=0, selBuild=null, mode='city';
function placeCastle(){
  const [wx,wz]=cellToWorld(HALF,HALF);const o=inst('castle');o.position.set(wx,-SEAT,wz);cityGroup.add(o);grid[HALF+','+HALF]='castle';
  [[0,0],[GRID-1,0],[0,GRID-1],[GRID-1,GRID-1]].forEach((s,i)=>{const [x,z]=cellToWorld(s[0],s[1]);const r=inst('rock');r.position.set(x,0,z);r.scale.setScalar(1.3);r.rotation.y=i;cityGroup.add(r);grid[s[0]+','+s[1]]='rock';});
}
function pop(){let p=4;buildings.forEach(b=>{if(b.def.pop)p+=b.def.pop;});return p;}
function jobsUsed(){let j=0;buildings.forEach(b=>{if(b.def.job&&b.active)j+=b.def.job;});return j;}
function recomputeJobs(){let budget=pop();buildings.forEach(b=>{if(b.def.job){if(budget>=b.def.job){b.active=true;budget-=b.def.job;}else b.active=false;if(b.worker)b.worker.visible=b.active;}});}
function hasCaserma(){return buildings.some(b=>b.key==='caserma');}

// ===== HUD =====
function fmt(n){return Math.floor(n);}
function drawTop(){let h='';for(const k in RES)h+=`<div class="res"><span class="ico">${RES[k]}</span>${fmt(R[k])}</div>`;h+=`<div class="res"><span class="ico">👥</span>${jobsUsed()}/${pop()}</div>`;document.getElementById('top').innerHTML=h;}
function drawBuildBar(){const bar=document.getElementById('build');let h='';for(const k in BUILD){const d=BUILD[k];const co=Object.entries(d.cost).map(([r,v])=>RES[r]+v).join(' ');h+=`<div class="bbtn${selBuild===k?' sel':''}" data-k="${k}"><div class="em">${d.em}</div><div class="n">${d.nome}</div><div class="co">${co}</div></div>`;}bar.innerHTML=h;bar.querySelectorAll('.bbtn').forEach(el=>el.onclick=()=>{selBuild=selBuild===el.dataset.k?null:el.dataset.k;drawBuildBar();hl.visible=false;toast(selBuild?'Tocca una casella libera per costruire':'');});}
function drawSide(){document.getElementById('soldBadge').textContent=soldiers;}
let toastTimer;function toast(msg,ms){const t=document.getElementById('toast');if(!msg){t.classList.remove('show');return;}t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),ms||2200);}
function canAfford(c){for(const r in c)if(R[r]<c[r])return false;return true;}
function pay(c){for(const r in c)R[r]-=c[r];}

// ===== COSTRUZIONE =====
function tryBuild(cx,cy){
  if(!selBuild)return;const key=cx+','+cy;
  if(grid[key]){toast('Casella occupata');return;}
  const d=BUILD[selBuild];if(!canAfford(d.cost)){toast('Risorse insufficienti');return;}
  pay(d.cost);const [wx,wz]=cellToWorld(cx,cy);
  const o=inst(d.file);o.position.set(wx,-SEAT,wz);o.rotation.y=(Math.random()*0.5-0.25);cityGroup.add(o);
  const b={key:selBuild,def:d,cx,cy,obj:o,timer:0,active:true,worker:null};
  if(d.job){const w=inst('worker');w.scale.setScalar(PS);w.position.set(wx+CELL*0.32,0,wz+CELL*0.32);w.rotation.y=-2.3;cityGroup.add(w);b.worker=w;}
  grid[key]=b;buildings.push(b);recomputeJobs();drawTop();save();
  toast(d.nome+' costruita!');if(selBuild==='caserma')toast('Ora puoi Addestrare soldati ⚔️');
}

// ===== PRODUZIONE =====
function produce(dt){buildings.forEach(b=>{if(!b.def.prod||!b.active)return;b.timer+=dt;if(b.timer>=b.def.prod.t){b.timer=0;R[b.def.prod.r]+=b.def.prod.a;if(b.worker)b.worker.position.y=0.1;}if(b.worker&&b.worker.position.y>0)b.worker.position.y=Math.max(0,b.worker.position.y-dt*0.35);});}

// ===== ADDESTRA =====
let training=0;
document.getElementById('btnTrain').onclick=()=>{if(mode!=='city')return;if(!hasCaserma()){toast('Serve una Caserma ⚔️');return;}if(training>0){toast('Addestramento in corso…');return;}const cost={cibo:25,ferro:10};if(!canAfford(cost)){toast('Servono 🌾25 ⚙️10');return;}pay(cost);drawTop();training=5;toast('Addestro un soldato…');};
function tickTrain(dt){if(training>0){training-=dt;if(training<=0){training=0;soldiers++;drawSide();save();toast('Nuovo soldato pronto! ⚔️');}}}

// ===== INPUT città =====
const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
function pick(ev){const r=canvas.getBoundingClientRect();ndc.x=((ev.clientX-r.left)/r.width)*2-1;ndc.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ndc,camera);const hit=ray.intersectObject(ground)[0];if(!hit)return null;const cx=Math.round(hit.point.x/CELL+HALF),cy=Math.round(hit.point.z/CELL+HALF);if(cx<0||cy<0||cx>=GRID||cy>=GRID)return null;return {cx,cy};}
canvas.addEventListener('pointermove',ev=>{if(mode!=='city'||!selBuild){hl.visible=false;return;}const c=pick(ev);if(!c){hl.visible=false;return;}const [wx,wz]=cellToWorld(c.cx,c.cy);hl.position.set(wx,0.05,wz);hl.visible=true;hl.material.color.set(grid[c.cx+','+c.cy]?0xff6b6b:0x7fffb0);});
canvas.addEventListener('pointerdown',ev=>{if(mode==='city'){const c=pick(ev);if(c)tryBuild(c.cx,c.cy);}else if(mode==='battle'){battleTap(ev);}});

// ===== SALVATAGGIO =====
function save(){try{localStorage.setItem('tuzu_rpg',JSON.stringify({R,soldiers,terreLiberate,b:buildings.map(b=>({k:b.key,cx:b.cx,cy:b.cy}))}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('tuzu_rpg'));if(!s)return false;R=s.R;soldiers=s.soldiers||0;terreLiberate=s.terreLiberate||0;(s.b||[]).forEach(it=>{const d=BUILD[it.k];if(!d)return;const [wx,wz]=cellToWorld(it.cx,it.cy);const o=inst(d.file);o.position.set(wx,-SEAT,wz);cityGroup.add(o);const b={key:it.k,def:d,cx:it.cx,cy:it.cy,obj:o,timer:0,active:true,worker:null};if(d.job){const w=inst('worker');w.scale.setScalar(PS);w.position.set(wx+CELL*0.32,0,wz+CELL*0.32);w.rotation.y=-2.3;cityGroup.add(w);b.worker=w;}grid[it.cx+','+it.cy]=b;buildings.push(b);});recomputeJobs();return true;}catch(e){return false;}}

// ===== BATTAGLIA =====
const BG=document.getElementById('bat'), HINT=document.getElementById('hint');
const batGroup=new THREE.Group();batGroup.visible=false;scene.add(batGroup);
const BGRID=7, BCELL=2.2, BHALF=(BGRID-1)/2;
let units=[], enemies=[], selUnit=null, turn='player', marks=[];
function bCellToWorld(x,y){return [(x-BHALF)*BCELL,(y-BHALF)*BCELL];}
function clearBattle(){while(batGroup.children.length)batGroup.remove(batGroup.children[0]);units=[];enemies=[];marks=[];selUnit=null;}
async function startBattle(){
  if(soldiers<1){toast('Non hai soldati. Addestrane! ⚔️');return;}
  mode='battle';selBuild=null;
  document.getElementById('build').style.display='none';document.getElementById('side').style.display='none';document.getElementById('top').style.display='none';
  cityGroup.visible=false;batGroup.visible=true;BG.style.display='flex';VZ=9;resize();clearBattle();
  const bgrass=grass.clone();bgrass.needsUpdate=true;bgrass.wrapS=bgrass.wrapT=THREE.RepeatWrapping;bgrass.repeat.set(BGRID,BGRID);bgrass.encoding=THREE.sRGBEncoding;
  const floorM=new THREE.MeshStandardMaterial({map:bgrass,color:0x8fb56f,roughness:1});floorM.envMapIntensity=0.4;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(BGRID*BCELL,BGRID*BCELL),floorM);floor.rotation.x=-Math.PI/2;floor.position.y=0.015;floor.receiveShadow=true;batGroup.add(floor);
  const gh=new THREE.GridHelper(BGRID*BCELL,BGRID,0xffffff,0xffffff);gh.position.y=0.03;gh.material.transparent=true;gh.material.opacity=0.22;batGroup.add(gh);
  const n=Math.min(soldiers,4);const heroes=['Knight.glb','Barbarian.glb','Mage.glb','Rogue.glb'];
  for(let i=0;i<n;i++){const o=await loadModel(AD+heroes[i%heroes.length]);o.scale.setScalar(0.42);o.rotation.y=Math.PI/2;const u={x:0,y:1+i,hp:30,max:30,atk:12,obj:o,done:false,enemy:false,bar:mkBar()};batGroup.add(o);batGroup.add(u.bar.g);place(u);units.push(u);}
  const ne=3+Math.min(terreLiberate,4);const sk=['Skeleton_Warrior.glb','Skeleton_Minion.glb','Skeleton_Rogue.glb'];
  for(let i=0;i<ne;i++){const o=await loadModel(SK+sk[i%sk.length]);o.scale.setScalar(0.42);o.rotation.y=-Math.PI/2;const e={x:BGRID-1,y:1+(i%(BGRID-2)),hp:18,max:18,atk:7,obj:o,enemy:true,bar:mkBar()};batGroup.add(o);batGroup.add(e.bar.g);place(e);enemies.push(e);}
  turn='player';units.forEach(u=>u.done=false);batInfo();HINT.style.display='block';HINT.textContent='Tocca un tuo soldato, poi una casella verde per muoverti o un nemico rosso per colpire.';
}
function mkBar(){const g=new THREE.Group();const bgM=new THREE.MeshBasicMaterial({color:0x111111});bgM.depthTest=false;const fgM=new THREE.MeshBasicMaterial({color:0x4ade80});fgM.depthTest=false;const bg=new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.2),bgM);const fg=new THREE.Mesh(new THREE.PlaneGeometry(1.14,0.14),fgM);fg.position.z=0.01;g.add(bg);g.add(fg);g.renderOrder=999;return {g,fg};}
function updBar(u){const f=Math.max(0,u.hp/u.max);u.bar.fg.scale.x=f;u.bar.fg.position.x=-0.57*(1-f);u.bar.fg.material.color.set(u.enemy?0xe24b4a:(f>0.5?0x4ade80:0xfacc15));u.bar.g.position.set(u.obj.position.x,1.55,u.obj.position.z);u.bar.g.lookAt(camera.position.x,1.55,camera.position.z);}
function place(u){const [wx,wz]=bCellToWorld(u.x,u.y);u.obj.position.set(wx,0,wz);u.bar.g.position.set(wx,1.55,wz);}
function occupied(x,y){return units.concat(enemies).find(u=>u.hp>0&&u.x===x&&u.y===y);}
function clearMarks(){marks.forEach(m=>batGroup.remove(m));marks=[];}
function addMark(x,y,color,op,data){const [wx,wz]=bCellToWorld(x,y);const m=new THREE.Mesh(new THREE.PlaneGeometry(BCELL*0.86,BCELL*0.86),new THREE.MeshBasicMaterial({color,transparent:true,opacity:op}));m.rotation.x=-Math.PI/2;m.position.set(wx,0.06,wz);m.userData=data;batGroup.add(m);marks.push(m);}
function showTargets(u){enemies.filter(e=>e.hp>0&&Math.abs(e.x-u.x)+Math.abs(e.y-u.y)===1).forEach(e=>addMark(e.x,e.y,0xff5555,0.5,{atk:true,target:e}));}
function showMoves(u){clearMarks();const range=3;for(let x=0;x<BGRID;x++)for(let y=0;y<BGRID;y++){const d=Math.abs(x-u.x)+Math.abs(y-u.y);if(d>0&&d<=range&&!occupied(x,y))addMark(x,y,0x5effa0,0.55,{move:true,x,y});}showTargets(u);}
function battleTap(ev){
  if(turn!=='player')return;const r=canvas.getBoundingClientRect();ndc.x=((ev.clientX-r.left)/r.width)*2-1;ndc.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ndc,camera);
  const hm=ray.intersectObjects(marks)[0];
  if(hm&&selUnit){const d=hm.object.userData;
    if(d.atk){doAttack(selUnit,d.target);selUnit.done=true;afterAct();return;}
    if(d.move){selUnit.x=d.x;selUnit.y=d.y;place(selUnit);const adj=enemies.filter(e=>e.hp>0&&Math.abs(e.x-selUnit.x)+Math.abs(e.y-selUnit.y)===1);if(adj.length){clearMarks();showTargets(selUnit);HINT.textContent='Colpisci un nemico rosso, oppure fine turno.';}else{selUnit.done=true;afterAct();}return;}}
  const picks=units.filter(u=>u.hp>0&&!u.done).map(u=>u.obj);
  const hu=ray.intersectObjects(picks,true)[0];
  if(hu){let o=hu.object;while(o.parent&&!units.find(u=>u.obj===o))o=o.parent;const u=units.find(x=>x.obj===o);if(u){selUnit=u;showMoves(u);HINT.textContent='Muoviti su una casella verde o colpisci un nemico rosso.';}}
}
function doAttack(a,b){b.hp-=a.atk;updBar(b);flash(b.obj);if(b.hp<=0){b.obj.visible=false;b.bar.g.visible=false;}checkEnd();}
function flash(obj){obj.traverse(m=>{if(m.isMesh&&m.material&&m.material.color){const mm=m.material;if(mm._o===undefined)mm._o=mm.color.getHex();mm.color.setHex(0xff3333);setTimeout(()=>mm.color.setHex(mm._o),150);}});}
function afterAct(){clearMarks();selUnit=null;if(mode==='battle'&&units.every(u=>u.hp<=0||u.done))endTurn();}
document.getElementById('endturn').onclick=endTurn;
function endTurn(){if(turn!=='player'||mode!=='battle')return;clearMarks();selUnit=null;turn='enemy';batInfo();setTimeout(enemyTurn,450);}
function enemyTurn(){let i=0;(function step(){if(mode!=='battle')return;if(i>=enemies.length){turn='player';units.forEach(u=>u.done=false);batInfo();return;}const e=enemies[i++];if(e.hp<=0){step();return;}const alive=units.filter(u=>u.hp>0);if(!alive.length){step();return;}alive.sort((a,b)=>(Math.abs(a.x-e.x)+Math.abs(a.y-e.y))-(Math.abs(b.x-e.x)+Math.abs(b.y-e.y)));const t=alive[0];let steps=3;while(steps-->0&&(Math.abs(t.x-e.x)+Math.abs(t.y-e.y))>1){let nx=e.x,ny=e.y;if(Math.abs(t.x-e.x)>=Math.abs(t.y-e.y))nx+=Math.sign(t.x-e.x);else ny+=Math.sign(t.y-e.y);if(occupied(nx,ny))break;e.x=nx;e.y=ny;place(e);}if(Math.abs(t.x-e.x)+Math.abs(t.y-e.y)===1)doAttack(e,t);setTimeout(step,280);})();}
function batInfo(){document.getElementById('batInfo').textContent=turn==='player'?'Il tuo turno':'Turno dell’Èrebo…';}
function checkEnd(){if(enemies.every(e=>e.hp<=0))endBattle(true);else if(units.every(u=>u.hp<=0))endBattle(false);}
function endBattle(win){if(mode!=='battle')return;mode='ended';HINT.style.display='none';BG.style.display='none';
  if(win){terreLiberate++;R.oro+=40;R.legna+=50;soldiers=units.filter(u=>u.hp>0).length;save();dialog('🏆','Terra liberata!','Hai respinto l’Èrebo! Ricompensa: 🪙40 🪵50. L’Ombra arretra… ma tornerà più forte.','Torna al regno',backToCity);}
  else{soldiers=0;save();dialog('🛡️','Ritirata','I tuoi soldati si ritirano. Ricostruisci le forze e riprova: il regno non è perduto.','Torna al regno',backToCity);}
}
function backToCity(){closeDialog();mode='city';batGroup.visible=false;cityGroup.visible=true;document.getElementById('build').style.display='flex';document.getElementById('side').style.display='flex';document.getElementById('top').style.display='flex';VZ=11;resize();drawSide();drawTop();}
document.getElementById('btnBattle').onclick=()=>{if(mode==='city')startBattle();};

// ===== DIALOG =====
function dialog(em,h,p,btn,cb){const d=document.createElement('div');d.className='panel';d.id='dyn';d.innerHTML=`<div class="card"><div class="em">${em}</div><h2>${h}</h2><p>${p}</p><button class="btn" id="d1">${btn}</button></div>`;document.body.appendChild(d);d.querySelector('#d1').onclick=cb;}
function closeDialog(){const d=document.getElementById('dyn');if(d)d.remove();}

// ===== LOOP =====
let last=performance.now(), saveT=0, started=false;
function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,0.1);last=now;
  if(started&&mode==='city'){produce(dt);tickTrain(dt);saveT+=dt;if(saveT>5){saveT=0;save();}drawTop();}
  if(mode==='battle'||mode==='ended')units.concat(enemies).forEach(u=>{if(u.hp>0)updBar(u);});
  renderer.render(scene,camera);}
requestAnimationFrame(tick);

// ===== AVVIO =====
(async function(){document.getElementById('loadtxt').textContent='Carico il regno…';await preload();const had=load();if(!had)placeCastle();else if(!grid[HALF+','+HALF])placeCastle();drawTop();drawBuildBar();drawSide();document.getElementById('load').style.display='none';})();
document.getElementById('startBtn').onclick=()=>{document.getElementById('intro').style.display='none';started=true;last=performance.now();toast('Tocca un edificio in basso, poi una casella per costruirlo',3200);};
</script>
</html>
