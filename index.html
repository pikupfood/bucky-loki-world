<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12">
  <title>Tuzuland</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b12; overflow: hidden; overscroll-behavior: none; }
    canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }
    #ui { z-index: 2; }
    /* il logo al centro mentre il gioco si carica: main.js lo toglie al primo fotogramma */
    #boot { position: fixed; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; z-index: 3; border-radius: 30px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
  <img id="boot" src="icon-512.png" alt="">
  <script>
    // Il gioco può essere servito come /cartella/ oppure /cartella (senza barra finale, come fa il sito):
    // carico lo script col percorso della cartella già giusto, così non parte nessuna richiesta a vuoto.
    (function () {
      var p = location.pathname;
      var dir = p.slice(-1) === '/' ? p : p.slice(-5) === '.html' ? p.slice(0, p.lastIndexOf('/') + 1) : p + '/';
      var s = document.createElement('script');
      s.type = 'module';
      s.src = dir + 'src/main.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
