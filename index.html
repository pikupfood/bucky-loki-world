<!doctype html>
<!-- La Terra dei Tuzu — L'Ombra (3D, asset reali) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a2336">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>La Terra dei Tuzu — L'Ombra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#241f30;--panel:#fbf7ff;--line:#e4ddf3;--accent:#b48cf5;--accent-d:#8f66d8;--good:#7ac28a;--bad:#e05b74;
    --shadow:rgba(20,15,40,.4);--font:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;margin:0;}
  html,body{height:100%;overflow:hidden;background:#12101a;font-family:var(--font);color:var(--ink);}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:26px;gap:16px;z-index:30;padding-top:calc(env(safe-area-inset-top) + 26px);padding-bottom:calc(env(safe-area-inset-bottom) + 26px);}
  .hidden{display:none!important;}
  #title{background:radial-gradient(120% 90% at 50% 8%,rgba(58,47,85,.4) 0%,rgba(14,12,20,.55) 70%);}
  .logo b{display:block;font-size:min(12vw,54px);font-weight:800;line-height:.95;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 0 #8f66d8,0 6px 20px rgba(0,0,0,.6);}
  .logo span{display:inline-block;margin-top:12px;font-size:min(4.4vw,18px);color:#efe6ff;font-weight:700;letter-spacing:4px;text-transform:uppercase;opacity:.9;}
  .subtitle{font-size:15px;max-width:420px;color:#f0e9ff;font-weight:600;line-height:1.55;z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.6);}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:16px;padding:14px 30px;font-size:18px;font-weight:800;cursor:pointer;
    font-family:var(--font);box-shadow:0 5px 0 var(--accent-d),0 8px 20px var(--shadow);transition:transform .06s,box-shadow .06s;z-index:2;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d);}
  .btn:disabled{opacity:.5;}
  .swatches{display:flex;gap:11px;flex-wrap:wrap;justify-content:center;z-index:2;}
  .sw{width:50px;height:50px;border-radius:50%;cursor:pointer;border:3px solid rgba(255,255,255,.3);box-shadow:0 3px 10px var(--shadow);transition:transform .1s;}
  .sw.on{transform:scale(1.18);border-color:#fff;}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .hp{background:rgba(20,16,30,.55);border-radius:13px;padding:7px 10px;pointer-events:auto;min-width:148px;}
  .hp .lbl{font-size:11px;font-weight:800;color:#fff;opacity:.9;display:flex;justify-content:space-between;margin-bottom:4px;}
  .hpbar{height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;}
  .hpbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6f91,#e05b74);transition:width .2s;}
  .obj{background:rgba(20,16,30,.55);border-radius:13px;padding:7px 12px;text-align:right;pointer-events:auto;max-width:52%;}
  .obj .lbl{font-size:10px;font-weight:800;color:#e8dcff;opacity:.75;text-transform:uppercase;letter-spacing:.5px;}
  .obj .txt{font-size:13.5px;font-weight:800;color:#fff;line-height:1.2;}

  #joy{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 26px);width:130px;height:130px;border-radius:50%;pointer-events:auto;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,.08));border:3px solid rgba(255,255,255,.35);box-shadow:0 6px 16px var(--shadow);}
  #stick{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#d9c4ff);box-shadow:0 4px 10px var(--shadow);transform:translate(-50%,-50%);}
  #atk{position:absolute;right:26px;bottom:calc(env(safe-area-inset-bottom) + 40px);width:92px;height:92px;border-radius:50%;color:#fff;border:none;font-size:34px;pointer-events:auto;
    background:radial-gradient(circle at 40% 35%,#ff7d93,#e05b74);font-family:var(--font);box-shadow:0 6px 0 #b83f55,0 10px 20px var(--shadow);transition:transform .06s,box-shadow .06s;}
  #atk:active{transform:translateY(4px);box-shadow:0 2px 0 #b83f55;}

  #dialogue{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);background:var(--panel);border-radius:20px;padding:15px 18px 12px;pointer-events:auto;z-index:20;
    box-shadow:0 10px 30px rgba(0,0,0,.45);animation:pop .18s ease;}
  @keyframes pop{from{transform:translateY(12px);opacity:0;}to{transform:none;opacity:1;}}
  #dialogue .who{font-weight:800;color:var(--accent-d);font-size:15px;margin-bottom:3px;}
  #dialogue .line{font-size:15.5px;font-weight:600;line-height:1.45;min-height:44px;}
  #dialogue .hint{text-align:right;font-size:12px;opacity:.45;margin-top:4px;font-weight:700;}
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translateX(-50%);background:rgba(20,16,30,.9);color:#fff;padding:9px 18px;border-radius:20px;
    font-weight:800;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;z-index:28;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  #banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:27;pointer-events:none;opacity:0;transition:opacity .5s;}
  #banner.show{opacity:1;}
  #banner .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(40,25,60,.3),rgba(15,12,22,.8));}
  #banner .tt{position:relative;color:#fff;font-size:min(8vw,34px);font-weight:800;text-shadow:0 3px 16px rgba(0,0,0,.6);padding:0 24px;}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#14121c;color:#e2d6ff;font-weight:700;z-index:40;}
  #loading .bar{width:200px;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;}
  #loading .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b48cf5,#7ac28a);transition:width .25s;}
</style>

<canvas id="c"></canvas>
<div id="loading"><div>Preparo la Terra dei Tuzu…</div><div class="bar"><i id="ldFill"></i></div></div>

<div id="title" class="overlay hidden">
  <div class="logo"><b>La Terra<br>dei Tuzu</b><span>L'Ombra</span></div>
  <div class="subtitle">Un male antico, l'Ombra, divora la terra. Tu sei il Tuzu che si leva: esplora, affronta le missioni e combatti per salvare il mondo. ⚔️</div>
  <div class="swatches" id="swatches"></div>
  <button class="btn" id="startBtn">Comincia ▶</button>
</div>

<div id="hud" class="hidden">
  <div class="top">
    <div class="hp"><div class="lbl"><span>❤️ Tuzu</span><span id="hpNum">100</span></div><div class="hpbar"><i id="hpFill"></i></div></div>
    <div class="obj"><div class="lbl">📜 Missione</div><div class="txt" id="objText">—</div></div>
  </div>
  <div id="joy"><div id="stick"></div></div>
  <button id="atk">⚔️</button>
</div>

<div id="toast"></div>
<div id="banner"><div class="bg"></div><div class="tt" id="btt"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script>
(function(){
"use strict";
const loadEl=document.getElementById('loading'),ldFill=document.getElementById('ldFill');
if(typeof THREE==='undefined'||!THREE.GLTFLoader){loadEl.innerHTML='Errore nel caricare la grafica 3D. Ricarica la pagina.';return;}

/* ---------- COLORI TUZU ---------- */
const BODY={lavanda:{l:0xd8bdff,d:0x9f74e8},menta:{l:0xbfe8cd,d:0x66b67d},pesca:{l:0xffd0bf,d:0xf2906f},cielo:{l:0xbfe2ff,d:0x5fb6f0},notte:{l:0x9a9ac0,d:0x50507a}};
const COLORS=['lavanda','menta','pesca','cielo','notte'];
let pickColor='lavanda';

/* ---------- THREE ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
const SKY=0x8fb7d6;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,60,150);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,500);
const hemi=new THREE.HemisphereLight(0xdfeeff,0x55503c,0.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,2.0);sun.position.set(-34,52,24);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=190;
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;
scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* ---------- TERRENO (texture erba) ---------- */
function groundY(x,z){return Math.sin(x*0.055)*Math.cos(z*0.05)*1.6+Math.sin(x*0.15+z*0.09)*0.5;}
const texLoader=new THREE.TextureLoader();
(function ground(){
  const g=new THREE.PlaneGeometry(500,500,110,110);g.rotateX(-Math.PI/2);
  const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,groundY(p.getX(i),p.getZ(i)));g.computeVertexNormals();
  const grass=texLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/terrain/grasslight-big.jpg');
  grass.wrapS=grass.wrapT=THREE.RepeatWrapping;grass.repeat.set(40,40);grass.encoding=THREE.sRGBEncoding;grass.anisotropy=4;
  const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:grass,roughness:.95,metalness:0,color:0xa8c58a}));mesh.receiveShadow=true;scene.add(mesh);
  // chiazze di corruzione (Ombra)
  for(let i=0;i<8;i++){const r=4+Math.random()*6;const cg=new THREE.CircleGeometry(r,20);cg.rotateX(-Math.PI/2);
    const c=new THREE.Mesh(cg,new THREE.MeshStandardMaterial({color:0x2a2240,roughness:1,transparent:true,opacity:.8}));
    const a=Math.random()*7,d=22+Math.random()*52;c.position.set(Math.cos(a)*d,groundY(Math.cos(a)*d,Math.sin(a)*d)+0.06,Math.sin(a)*d);c.receiveShadow=true;scene.add(c);}
})();

/* ---------- TUZU (eroe) ---------- */
function makeTuzu(colorId,hero){const C=BODY[colorId]||BODY.lavanda;const g=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color:C.l,roughness:.35,metalness:.0,envMapIntensity:1.1});
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,40,30),bodyMat);body.scale.set(1,1.12,0.97);body.position.y=1.12;body.castShadow=true;g.add(body);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.64,24,18),new THREE.MeshStandardMaterial({color:C.d,roughness:.5,transparent:true,opacity:.3}));belly.position.set(0,0.92,0.56);belly.scale.set(1,1,.5);g.add(belly);
  const eyeM=new THREE.MeshStandardMaterial({color:0x201b2c,roughness:.15,metalness:.1});
  const eL=new THREE.Mesh(new THREE.SphereGeometry(0.175,16,14),eyeM);eL.position.set(-0.32,1.3,0.86);g.add(eL);const eR=eL.clone();eR.position.x=0.32;g.add(eR);
  const glM=new THREE.MeshBasicMaterial({color:0xffffff});
  const gL=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,8),glM);gL.position.set(-0.26,1.37,1.01);g.add(gL);const gR=gL.clone();gR.position.x=0.38;g.add(gR);
  const footM=new THREE.MeshStandardMaterial({color:C.d,roughness:.5});
  const fL=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),footM);fL.scale.set(1,.7,1.25);fL.position.set(-0.42,0.24,0.2);fL.castShadow=true;g.add(fL);const fR=fL.clone();fR.position.x=0.42;g.add(fR);
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.17,0.5,8),new THREE.MeshStandardMaterial({color:0x7ac28a,roughness:.5}));leaf.position.set(0,2.34,0);leaf.rotation.z=-0.5;g.add(leaf);
  if(hero){const gold=new THREE.MeshStandardMaterial({color:0xf2c14e,roughness:.25,metalness:.85,envMapIntensity:1.4});
    const crown=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.58,0.28,14),gold);crown.position.y=2.26;g.add(crown);
    for(let i=0;i<6;i++){const sp=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.3,8),gold);const a=i/6*Math.PI*2;sp.position.set(Math.cos(a)*0.5,2.5,Math.sin(a)*0.5);g.add(sp);}}
  g.userData={body,fL,fR};return g;}
let player=makeTuzu(pickColor,true);scene.add(player);
function rebuildPlayer(color){const pos=player.position.clone(),rot=player.rotation.y;scene.remove(player);player=makeTuzu(color,true);player.position.copy(pos);player.rotation.y=rot;scene.add(player);}

/* ---------- NEMICI (Ombra) ---------- */
const enemies=[];
function makeEnemy(){const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.IcosahedronGeometry(0.98,0),new THREE.MeshStandardMaterial({color:0x2a2044,roughness:.5,metalness:.3,flatShading:true,emissive:0x2a0e40,emissiveIntensity:.5}));
  body.position.y=1.1;body.castShadow=true;g.add(body);
  const em=new THREE.MeshBasicMaterial({color:0xff2a55});
  const eL=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,10),em);eL.position.set(-0.3,1.25,0.78);g.add(eL);const eR=eL.clone();eR.position.x=0.3;g.add(eR);
  for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.55,6),new THREE.MeshStandardMaterial({color:0x160e28,roughness:.6,metalness:.2,flatShading:true}));const a=i/6*Math.PI*2;s.position.set(Math.cos(a)*0.72,1.6,Math.sin(a)*0.72);s.rotation.x=0.6;s.rotation.y=a;s.castShadow=true;g.add(s);}
  g.userData={hp:40,body,hit:0,atkcd:0};return g;}
function spawnEnemy(){const g=makeEnemy();const a=Math.random()*7,d=22+Math.random()*26;g.position.set(Math.cos(a)*d,groundY(Math.cos(a)*d,Math.sin(a)*d),Math.sin(a)*d);scene.add(g);enemies.push(g);}

/* ---------- ASSET LOADER (natura CC0 + HDR) ---------- */
const NAT='https://cdn.jsdelivr.net/gh/flo-bit/low-poly-asset-packs@main/nature-pack/glb/';
const HDR='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/equirectangular/royal_esplanade_1k.hdr';
const gltfLoader=new THREE.GLTFLoader();
const proto={};
function loadModel(name){return new Promise(res=>{gltfLoader.load(NAT+name+'.glb',g=>{const o=g.scene;o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;if(m.material){m.material.envMapIntensity=1.0;}}});res(o);},undefined,()=>res(null));});}
function loadHDR(){return new Promise(res=>{try{const rl=new THREE.RGBELoader();rl.load(HDR,tex=>{const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileEquirectangularShader();const env=pmrem.fromEquirectangular(tex).texture;scene.environment=env;tex.dispose();pmrem.dispose();res(true);},undefined,()=>res(false));}catch(e){res(false);}});}

const TREES=['common_tree_1','common_tree_2','common_tree_3'];
const STONES=['stone_1','stone_2','stone_5'];
const BUSH=['bush_1','bush_3','bush_berries_1'];
const GRASS=['grass_1','grass_2'];
const DECO=['flower_1','flower_2','mushroom_1','mushroom_group_1'];
const ALL=[...TREES,...STONES,...BUSH,...GRASS,...DECO];

let loaded=0;const total=ALL.length+1;
function bump(){loaded++;ldFill.style.width=Math.round(loaded/total*100)+'%';}
function place(o,x,z,s,rotY){const m=o.clone(true);m.position.set(x,groundY(x,z),z);m.scale.setScalar(s);m.rotation.y=rotY||Math.random()*Math.PI*2;scene.add(m);return m;}

Promise.all([
  loadHDR().then(ok=>bump()),
  ...ALL.map(n=>loadModel(n).then(o=>{proto[n]=o;bump();}))
]).then(()=>{
  // popola il mondo con i modelli veri
  const treeS=1.45, stoneS=1.05, bushS=0.95, grassS=1.05, decoS=0.95;
  for(let i=0;i<78;i++){const a=Math.random()*7,d=13+Math.random()*58;const x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.hypot(x,z)<12)continue;const t=proto[TREES[i%TREES.length]];if(t)place(t,x,z,treeS*(0.82+Math.random()*0.4));}
  for(let i=0;i<32;i++){const a=Math.random()*7,d=10+Math.random()*62;const x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.hypot(x,z)<8)continue;const t=proto[STONES[i%STONES.length]];if(t)place(t,x,z,stoneS*(0.7+Math.random()*0.7));}
  for(let i=0;i<48;i++){const a=Math.random()*7,d=8+Math.random()*62;const x=Math.cos(a)*d,z=Math.sin(a)*d;if(Math.hypot(x,z)<6)continue;const t=proto[BUSH[i%BUSH.length]];if(t)place(t,x,z,bushS*(0.7+Math.random()*0.6));}
  for(let i=0;i<160;i++){const a=Math.random()*7,d=6+Math.random()*64;const x=Math.cos(a)*d,z=Math.sin(a)*d;const t=proto[GRASS[i%GRASS.length]];if(t){const m=place(t,x,z,grassS*(0.7+Math.random()*0.7));m.traverse(o=>{if(o.isMesh)o.castShadow=false;});}}
  for(let i=0;i<40;i++){const a=Math.random()*7,d=8+Math.random()*60;const x=Math.cos(a)*d,z=Math.sin(a)*d;const t=proto[DECO[i%DECO.length]];if(t)place(t,x,z,decoS*(0.7+Math.random()*0.6));}
  // pronti
  loadEl.classList.add('hidden');
  document.getElementById('title').classList.remove('hidden');
  mode='title';
  camera.position.set(0,6,9);
});

/* ---------- STATO ---------- */
let mode='boot';
const state={hp:100,max:100,kills:0,hurt:0,atkcd:0,attacking:0,obj:0};
const OBJS=[{text:'Affronta le Ombre ⚔️',need:3},{text:'Sconfiggi 6 Ombre',need:6},{text:'Libera la radura: 12 Ombre',need:12}];

/* ---------- INPUT ---------- */
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();doAttack();}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const joy={active:false,dx:0,dy:0,id:null,ox:0,oy:0};
const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
function jS(x,y,id){const r=joyEl.getBoundingClientRect();joy.active=true;joy.id=id;joy.ox=r.left+r.width/2;joy.oy=r.top+r.height/2;jM(x,y);}
function jM(x,y){let dx=x-joy.ox,dy=y-joy.oy;const d=Math.hypot(dx,dy),m=46;if(d>m){dx=dx/d*m;dy=dy/d*m;}joy.dx=dx/m;joy.dy=dy/m;stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}
function jE(){joy.active=false;joy.dx=joy.dy=0;joy.id=null;stick.style.transform='translate(-50%,-50%)';}
joyEl.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jS(t.clientX,t.clientY,t.identifier);},{passive:false});
joyEl.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id)jM(t.clientX,t.clientY);},{passive:false});
joyEl.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id)jE();});
joyEl.addEventListener('mousedown',e=>{jS(e.clientX,e.clientY,'m');});
addEventListener('mousemove',e=>{if(joy.active&&joy.id==='m')jM(e.clientX,e.clientY);});
addEventListener('mouseup',()=>{if(joy.id==='m')jE();});
document.getElementById('atk').addEventListener('click',doAttack);

/* ---------- COMBAT ---------- */
let rings=[];
function doAttack(){if(mode!=='play'||state.atkcd>0)return;state.atkcd=.45;state.attacking=.25;sfx('atk');
  const fx=Math.sin(player.rotation.y),fz=Math.cos(player.rotation.y);let hitAny=false;
  for(const e of enemies){const dx=e.position.x-player.position.x,dz=e.position.z-player.position.z,d=Math.hypot(dx,dz)||1;
    if(d<3.4){const dot=(dx*fx+dz*fz)/d;if(dot>0.1||d<1.7){e.userData.hp-=22;e.userData.hit=.2;hitAny=true;sfx('hit');e.position.x+=dx/d*0.7;e.position.z+=dz/d*0.7;}}}
  if(hitAny){const m=new THREE.Mesh(new THREE.RingGeometry(0.6,0.95,24),new THREE.MeshBasicMaterial({color:0xffe7a0,transparent:true,opacity:.9,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(player.position.x,player.position.y+0.3,player.position.z);scene.add(m);rings.push({m,life:1});}
}

/* ---------- DIALOGO/HUD ---------- */
let dialogue=null;
function say(who,lines,onEnd){const el=mkDlg();dialogue={who,lines:lines.filter(Boolean),idx:0,onEnd};mode='dialogue';renderDlg(el);}
function mkDlg(){let el=document.getElementById('dialogue');if(!el){el=document.createElement('div');el.id='dialogue';document.getElementById('hud').appendChild(el);}el.classList.remove('hidden');return el;}
function renderDlg(el){el=el||document.getElementById('dialogue');el.innerHTML=`<div class="who">${dialogue.who}</div><div class="line">${dialogue.lines[dialogue.idx]}</div><div class="hint">tocca per continuare ▶</div>`;el.onclick=advDlg;}
function advDlg(){if(!dialogue)return;dialogue.idx++;if(dialogue.idx>=dialogue.lines.length){const cb=dialogue.onEnd,d=document.getElementById('dialogue');if(d)d.classList.add('hidden');dialogue=null;mode='play';if(cb)cb();}else renderDlg();}
function updateHUD(){document.getElementById('hpNum').textContent=Math.max(0,Math.round(state.hp));document.getElementById('hpFill').style.width=Math.max(0,state.hp/state.max*100)+'%';
  const o=OBJS[state.obj];document.getElementById('objText').textContent=o?(o.text+` (${Math.min(state.kills,o.need)}/${o.need})`):'Terra liberata! 🌟';}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1500);}
function banner(txt){const b=document.getElementById('banner');document.getElementById('btt').textContent=txt;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),2200);}
let actx=null;function sfx(t){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const c=actx.currentTime,b=(f,d,at,v)=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='square';o.frequency.setValueAtTime(f,c+at);g.gain.setValueAtTime(v||.05,c+at);g.gain.exponentialRampToValueAtTime(.0001,c+at+d);o.start(c+at);o.stop(c+at+d);};
  if(t==='atk')b(300,.09,0);else if(t==='hit')b(160,.1,0,.07);else if(t==='die'){b(220,.1,0);b(120,.18,.08);}else if(t==='hurt')b(100,.14,0,.09);}catch(e){}}
function checkObj(){const o=OBJS[state.obj];if(!o)return;if(state.kills>=o.need){if(state.obj<OBJS.length-1){state.obj++;banner('Missione completata! ⚔️');}else banner('🌟 Radura liberata!');}updateHUD();}
let flashEl=null;function hurtFlash(){if(!flashEl){flashEl=document.createElement('div');flashEl.style.cssText='position:fixed;inset:0;background:rgba(220,60,80,.28);z-index:15;pointer-events:none;opacity:0;transition:opacity .1s';document.body.appendChild(flashEl);}flashEl.style.opacity='1';setTimeout(()=>{if(flashEl)flashEl.style.opacity='0';},110);}
function respawn(){state.hp=state.max;player.position.set(0,0,0);banner('Ti sei ripreso 💜');toast('Il mondo non ti abbandona');for(const e of enemies)if(Math.hypot(e.position.x,e.position.z)<11)e.position.multiplyScalar(2.2);}

/* ---------- UPDATE ---------- */
let spawnT=0;
function update(dt){
  let ix=0,iz=0;
  if(keys['w']||keys['arrowup'])iz--;if(keys['s']||keys['arrowdown'])iz++;if(keys['a']||keys['arrowleft'])ix--;if(keys['d']||keys['arrowright'])ix++;
  if(joy.active){ix+=joy.dx;iz+=joy.dy;}
  let mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag;}
  if(mag>0.06){const sp=8.5*Math.min(mag,1)*dt;player.position.x+=ix*sp;player.position.z+=iz*sp;
    const tr=Math.atan2(ix,iz);let d=tr-player.rotation.y;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;player.rotation.y+=d*Math.min(1,dt*12);
    const w=performance.now()/90;player.userData.fL.position.z=0.2+Math.sin(w)*0.22;player.userData.fR.position.z=0.2-Math.sin(w)*0.22;}
  const lim=66;player.position.x=Math.max(-lim,Math.min(lim,player.position.x));player.position.z=Math.max(-lim,Math.min(lim,player.position.z));
  player.position.y=groundY(player.position.x,player.position.z);
  if(state.attacking>0){state.attacking-=dt;player.userData.body.scale.set(1+state.attacking,1.12-state.attacking*.5,0.97+state.attacking);}else player.userData.body.scale.set(1,1.12,0.97);
  if(state.atkcd>0)state.atkcd-=dt;if(state.hurt>0)state.hurt-=dt;
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
    if(e.userData.hp<=0){scene.remove(e);enemies.splice(i,1);state.kills++;sfx('die');toast('Ombra sconfitta! 💥');checkObj();continue;}
    const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz)||1;
    if(d<18&&d>1.5){const sp=3.8*dt;e.position.x+=dx/d*sp;e.position.z+=dz/d*sp;e.rotation.y=Math.atan2(dx,dz);}
    e.position.y=groundY(e.position.x,e.position.z);
    e.userData.atkcd-=dt;
    if(d<1.9&&e.userData.atkcd<=0){e.userData.atkcd=1;if(state.hurt<=0){state.hp-=12;state.hurt=.35;sfx('hurt');hurtFlash();updateHUD();if(state.hp<=0)respawn();}}
  }
  spawnT-=dt;const want=Math.min(7,3+state.obj*2);if(spawnT<=0&&enemies.length<want){spawnT=2.2;spawnEnemy();}
  const cx=player.position.x,cy=player.position.y+16,cz=player.position.z+15;
  camera.position.x+=(cx-camera.position.x)*0.1;camera.position.y+=(cy-camera.position.y)*0.1;camera.position.z+=(cz-camera.position.z)*0.1;
  camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);
}

/* ---------- LOOP ---------- */
const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);let dt=clock.getDelta();if(dt>.05)dt=.05;const t=performance.now()/1000;
  try{
    if(mode==='title'){const a=t*0.4;camera.position.set(Math.sin(a)*9,6,Math.cos(a)*9);camera.lookAt(player.position.x,1.4,player.position.z);}
    else if(mode==='play')update(dt);
    if(player.userData&&player.userData.body)player.userData.body.position.y=1.12+Math.sin(t*2.2)*0.04;
    for(const e of enemies){e.userData.body.rotation.y+=dt*0.8;e.userData.body.position.y=1.1+Math.sin(t*3+e.position.x)*0.12;e.userData.hit-=dt;e.userData.body.material.emissiveIntensity=e.userData.hit>0?1.6:.5;}
    rings=rings.filter(r=>{r.life-=dt*2.4;r.m.scale.setScalar(1+(1-r.life)*3);r.m.material.opacity=Math.max(0,r.life*.9);if(r.life<=0){scene.remove(r.m);return false;}return true;});
    renderer.render(scene,camera);
  }catch(e){console.error('tick',e);}
}

/* ---------- PICK ---------- */
const sw=document.getElementById('swatches');
COLORS.forEach(c=>{const d=document.createElement('div');d.className='sw'+(c==='lavanda'?' on':'');d.style.background='#'+BODY[c].l.toString(16).padStart(6,'0');d.dataset.c=c;
  d.onclick=()=>{pickColor=c;sw.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c===c));rebuildPlayer(c);};sw.appendChild(d);});

/* ---------- FLOW ---------- */
document.getElementById('startBtn').onclick=()=>{
  document.getElementById('title').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  rebuildPlayer(pickColor);player.position.set(0,0,0);player.rotation.y=Math.PI;
  state.hp=state.max;state.kills=0;state.obj=0;
  camera.position.set(0,17,17);camera.lookAt(0,1.4,0);
  for(let i=0;i<3;i++)spawnEnemy();
  updateHUD();
  say('🦉 Saggio',["L'Ombra è tornata, piccolo Tuzu. 🌑","Divora la terra, un lembo alla volta.","Colpisci con ⚔️, muoviti con la leva. Libera la radura dalle Ombre!"]);
};
tick();
})();
</script>
