<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12">
  <title>I Regni di Tuzu — La Difesa dei Chlòri</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b12; overflow: hidden; overscroll-behavior: none; }
    canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }
    #ui { z-index: 2; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
  <script>
    // Il gioco può essere servito come /cartella/ oppure /cartella (senza barra finale, come fa il sito):
    // carico lo script col percorso della cartella già giusto, così non parte nessuna richiesta a vuoto.
    (function () {
      var p = location.pathname;
      var dir = p.slice(-1) === '/' ? p : p.slice(-5) === '.html' ? p.slice(0, p.lastIndexOf('/') + 1) : p + '/';
      var s = document.createElement('script');
      s.type = 'module';
      s.src = dir + 'src/main.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
